name: Product Hunt Weekly Analysis

on:
  schedule:
    # Runs every Monday at 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * 1'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  analyze_producthunt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic
      
      - name: Run Product Hunt Analysis
        env:
          PRODUCTHUNT_CLIENT_ID: ${{ secrets.PRODUCTHUNT_CLIENT_ID }}
          PRODUCTHUNT_CLIENT_SECRET: ${{ secrets.PRODUCTHUNT_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/product_hunt_weekly.py
      
      - name: Log execution
        if: always()
        run: echo "Product Hunt weekly analysis completed at $(date)"
